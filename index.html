<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo</title>
    <link rel="stylesheet" href="./lib/bootstrap/css/bootstrap.min.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #eef2f7;
      }

      .app-shell {
        height: 100vh;
        padding: 0.75rem;
        overflow: hidden;
      }

      .app-card {
        height: calc(100vh - 1.5rem);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .app-header,
      .app-tabs,
      .app-controls,
      .app-stats {
        flex: 0 0 auto;
      }

      .app-content {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }

      .browser-tabs {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.25rem;
        min-height: 2.25rem;
        overflow: hidden;
      }

      .browser-tab {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        max-width: 12rem;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--bs-border-color);
        border-bottom: 0;
        border-radius: 0.75rem 0.75rem 0 0;
        background: var(--bs-tertiary-bg);
        color: var(--bs-secondary-color);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .browser-tab.active {
        background: var(--bs-body-bg);
        color: var(--bs-primary);
        border-color: var(--bs-primary-border-subtle);
      }

      .min-w-0 {
        min-width: 0;
      }

      .tab-main-button {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-width: 0;
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        font: inherit;
      }

      .browser-tab .tab-label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .browser-tab-close {
        border: 0;
        background: transparent;
        color: inherit;
        line-height: 1;
        padding: 0;
        opacity: 0.65;
      }

      .browser-tab-close:hover {
        opacity: 1;
      }

      .tab-add-form {
        min-width: 14rem;
        max-width: 20rem;
      }

      .compact-label {
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--bs-secondary-color);
        margin-bottom: 0.15rem;
      }

      .stat-tile {
        min-height: 3.25rem;
      }

      .todo-title.done {
        text-decoration: line-through;
      }

      .todo-list-compact .list-group-item {
        padding: 0.55rem 0.75rem;
      }

      .timeline {
        position: relative;
        overflow: hidden;
      }

      .timeline::before {
        content: "";
        position: absolute;
        top: 0.5rem;
        bottom: 0.5rem;
        left: 0.45rem;
        width: 2px;
        background: var(--bs-border-color);
      }

      .timeline-item {
        position: relative;
        padding-left: 1.5rem;
        padding-bottom: 0.55rem;
      }

      .timeline-dot {
        position: absolute;
        top: 0.45rem;
        left: 0.12rem;
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        background: var(--bs-primary);
        box-shadow: 0 0 0 0.2rem var(--bs-body-bg);
      }

      .timeline-item.is-done .timeline-dot {
        background: var(--bs-secondary);
      }

      .timeline-item.is-overdue .timeline-dot {
        background: var(--bs-danger);
      }

      .content-panel {
        height: 100%;
        overflow: hidden;
      }

      .content-panel .card-body {
        height: 100%;
        overflow: hidden;
      }

      .remaining-note {
        font-size: 0.75rem;
      }

      @media (max-width: 991.98px) {
        .app-shell {
          padding: 0.5rem;
        }

        .app-card {
          height: calc(100vh - 1rem);
        }

        .hide-on-compact {
          display: none !important;
        }

        .browser-tab {
          max-width: 8.5rem;
          padding-inline: 0.55rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div class="app-card card border-0 shadow-sm">
        <header class="app-header card-header bg-white border-0 px-3 px-lg-4 pt-3 pb-2">
          <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
            <div>
              <p class="text-uppercase text-primary fw-semibold small mb-1 hide-on-compact">Portfolio Sample</p>
              <h1 class="h3 fw-bold mb-1">Todo Dashboard</h1>
              <p class="text-secondary small mb-0 hide-on-compact">
                1画面で、タスク・締切・重要度・カテゴリを管理します。
              </p>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <span id="todo-count-badge" class="badge text-bg-primary rounded-pill px-3 py-2">未完了 0件</span>
              <span id="deadline-count-badge" class="badge text-bg-warning rounded-pill px-3 py-2">締切 0件</span>
              <span id="category-count-badge" class="badge text-bg-light border rounded-pill px-3 py-2">カテゴリ 0件</span>
            </div>
          </div>
        </header>

        <section class="app-tabs px-3 px-lg-4 pt-2 border-bottom bg-white">
          <div class="d-flex flex-wrap align-items-end justify-content-between gap-2">
            <div id="category-list" class="browser-tabs" role="tablist" aria-label="表示タブ"></div>
            <form id="category-form" class="input-group input-group-sm tab-add-form pb-1">
              <input
                id="category-input"
                class="form-control"
                placeholder="カテゴリ追加"
                aria-label="追加するカテゴリ"
                autocomplete="off"
              />
              <button class="btn btn-outline-primary" type="submit">＋</button>
            </form>
          </div>
        </section>

        <section class="app-controls px-3 px-lg-4 py-2 bg-white border-bottom">
          <form id="todo-form" class="row g-2 align-items-end mb-2">
            <div class="col-12 col-lg-4">
              <label for="todo-input" class="compact-label">タスク名</label>
              <input
                id="todo-input"
                class="form-control form-control-sm"
                placeholder="例：レポートを提出する"
                aria-label="追加するタスク"
                autocomplete="off"
                required
              />
            </div>
            <div class="col-6 col-lg-2">
              <label for="deadline-input" class="compact-label">締切</label>
              <input id="deadline-input" class="form-control form-control-sm" type="datetime-local" aria-label="締切日時" />
            </div>
            <div class="col-6 col-lg-2">
              <label for="category-select" class="compact-label">カテゴリ</label>
              <select id="category-select" class="form-select form-select-sm" aria-label="カテゴリを選択">
                <option value="">未分類</option>
              </select>
            </div>
            <div class="col-6 col-lg-1">
              <label class="compact-label d-block">重要</label>
              <div class="form-check form-switch mt-1">
                <input id="important-input" class="form-check-input" type="checkbox" role="switch" />
                <label for="important-input" class="form-check-label small">ON</label>
              </div>
            </div>
            <div class="col-6 col-lg-1">
              <button class="btn btn-primary btn-sm w-100" type="submit">追加</button>
            </div>
            <div class="col-12 col-lg-2">
              <button id="clear-completed" class="btn btn-outline-secondary btn-sm w-100" type="button">完了済み削除</button>
            </div>
          </form>

          <div class="row g-2 align-items-end">
            <div class="col-12 col-lg-4">
              <label for="search-input" class="compact-label">検索</label>
              <input id="search-input" class="form-control form-control-sm" type="search" placeholder="タスク名・カテゴリで検索" autocomplete="off" />
            </div>
            <div class="col-6 col-lg-3">
              <label for="status-filter" class="compact-label">表示条件</label>
              <select id="status-filter" class="form-select form-select-sm">
                <option value="all">すべて</option>
                <option value="active">未完了のみ</option>
                <option value="done">完了済みのみ</option>
                <option value="important">重要のみ</option>
                <option value="overdue">期限切れのみ</option>
              </select>
            </div>
            <div class="col-6 col-lg-3">
              <label for="sort-select" class="compact-label">並び替え</label>
              <select id="sort-select" class="form-select form-select-sm">
                <option value="deadline">締切順</option>
                <option value="importance">重要度順</option>
                <option value="createdDesc">作成順（新しい順）</option>
                <option value="createdAsc">作成順（古い順）</option>
                <option value="done">完了状況順</option>
              </select>
            </div>
            <div class="col-12 col-lg-2">
              <button id="reset-controls" class="btn btn-outline-secondary btn-sm w-100" type="button">条件リセット</button>
            </div>
          </div>
        </section>

        <section class="app-stats px-3 px-lg-4 py-2 bg-white border-bottom">
          <div class="row g-2 align-items-center">
            <div class="col-6 col-lg-2">
              <div class="stat-tile rounded border bg-light px-3 py-2">
                <div class="text-secondary small">全タスク</div>
                <div id="stat-total" class="h5 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-6 col-lg-2">
              <div class="stat-tile rounded border bg-light px-3 py-2">
                <div class="text-secondary small">完了</div>
                <div id="stat-done" class="h5 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-6 col-lg-2">
              <div class="stat-tile rounded border bg-light px-3 py-2">
                <div class="text-secondary small">重要</div>
                <div id="stat-important" class="h5 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-6 col-lg-2">
              <div class="stat-tile rounded border bg-light px-3 py-2">
                <div class="text-secondary small">期限切れ</div>
                <div id="stat-overdue" class="h5 fw-bold mb-0">0</div>
              </div>
            </div>
            <div class="col-12 col-lg-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-semibold small">進捗</span>
                <span id="progress-label" class="text-secondary small">0 / 0 完了</span>
              </div>
              <div class="progress" role="progressbar" aria-label="タスク完了率" style="height: 0.9rem;">
                <div id="progress-bar" class="progress-bar" style="width: 0%">0%</div>
              </div>
            </div>
          </div>
        </section>

        <section class="app-content px-3 px-lg-4 py-3">
          <div class="row g-3 h-100">
            <section class="col-12 col-lg-7 h-100">
              <div class="card border-0 shadow-sm content-panel">
                <div class="card-body p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                      <h2 class="h5 fw-bold mb-0">タスク一覧</h2>
                      <p id="visible-count-text" class="text-secondary small mb-0">0件を表示中</p>
                    </div>
                    <span id="active-tab-label" class="badge text-bg-primary rounded-pill">ALL</span>
                  </div>
                  <ul id="todo-list" class="list-group todo-list-compact"></ul>
                </div>
              </div>
            </section>

            <section class="col-12 col-lg-5 h-100 hide-on-compact">
              <div class="card border-0 shadow-sm content-panel">
                <div class="card-body p-3">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                      <h2 class="h5 fw-bold mb-0">締切タイムライン</h2>
                      <p class="text-secondary small mb-0">選択タブに連動して締切順で表示</p>
                    </div>
                  </div>
                  <div id="deadline-timeline" class="timeline"></div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <div class="modal fade" id="edit-todo-modal" tabindex="-1" aria-labelledby="edit-todo-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <form id="edit-todo-form" class="modal-content">
          <div class="modal-header">
            <h2 id="edit-todo-title" class="modal-title h5">タスク編集</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
          </div>
          <div class="modal-body">
            <input id="edit-todo-id" type="hidden" />

            <div class="mb-3">
              <label for="edit-todo-input" class="form-label fw-semibold">タスク名</label>
              <input id="edit-todo-input" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="edit-deadline-input" class="form-label fw-semibold">締切</label>
              <input id="edit-deadline-input" class="form-control" type="datetime-local" />
            </div>

            <div class="mb-3">
              <label for="edit-category-select" class="form-label fw-semibold">カテゴリ</label>
              <select id="edit-category-select" class="form-select">
                <option value="">未分類</option>
              </select>
            </div>

            <div class="form-check form-switch">
              <input id="edit-important-input" class="form-check-input" type="checkbox" role="switch" />
              <label for="edit-important-input" class="form-check-label fw-semibold">重要</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="todo-toast" class="toast align-items-center text-bg-primary border-0" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
          <div id="todo-toast-body" class="toast-body">追加しました</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="閉じる"></button>
        </div>
      </div>
    </div>

    <script src="./lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
